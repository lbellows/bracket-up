name: Release APK

# Builds one signed APK per CPU architecture, proves each one runs, and attaches
# them to a GitHub Release. The self-hosted F-Droid repo pulls the APKs from
# there.
#
# Each ABI builds in its own job. The native compilation is per-architecture, so
# three parallel jobs finish in well under the wall clock of one job doing all
# three; the repo is public, so the extra runner minutes cost nothing.
#
# A manual run (workflow_dispatch) does everything except publish, and defaults
# to arm64-v8a alone — the ABI every modern phone uses, so it is both the
# quickest check and the artifact to sideload. Pick "all" to exercise the full
# release path. A tag always builds all three regardless.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      abis:
        description: Which ABIs to build
        type: choice
        options:
          - arm64-v8a
          - all
        default: arm64-v8a

permissions:
  contents: write

env:
  # Self-imposed download-size ceiling for a single APK. A universal APK with
  # every architecture in it was ~97 MB, which is why the build is split per ABI
  # and minified; this guard is here so a future dependency cannot quietly undo
  # that.
  MAX_APK_BYTES: 30000000

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      abis: ${{ steps.pick.outputs.abis }}
    steps:
      # A tag builds everything that gets published. Only a manual run may
      # narrow it, and then it defaults to the one ABI worth sideloading.
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.abis }}" != "all" ]; then
            echo 'abis=["arm64-v8a"]' >> "$GITHUB_OUTPUT"
          else
            echo 'abis=["armeabi-v7a","arm64-v8a","x86_64"]' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      # One ABI failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.setup.outputs.abis) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      # android/gradle.properties asks for 2 GB, which leaves R8 and the Kotlin
      # compiler thrashing on a 16 GB runner. GRADLE_USER_HOME takes precedence
      # over the project file, so this lifts the ceiling for CI without touching
      # the committed native project (which prebuild:check would flag) or
      # imposing a 6 GB heap on anyone building locally.
      - name: Raise the Gradle heap for CI
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\n' \
            >> ~/.gradle/gradle.properties

      - name: Install dependencies
        run: npm ci

      - name: Verify committed android/ matches app.json
        run: npm run prebuild:check

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See FDROID.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the ${{ matrix.abi }} APK
        env:
          BRACKETUP_STORE_FILE: ${{ runner.temp }}/release.keystore
          BRACKETUP_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BRACKETUP_KEY_ALIAS: bracketup
          BRACKETUP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=${{ matrix.abi }}

      - name: Check the APK is signed, single-ABI, permission-free and small enough
        env:
          ABI: ${{ matrix.abi }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          APKS=(android/app/build/outputs/apk/release/*.apk)
          # Narrowing reactNativeArchitectures to one ABI must yield exactly one
          # APK; more than that means the split or the property stopped working.
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected 1 APK for $ABI, found ${#APKS[@]}."
            exit 1
          fi
          APK="${APKS[0]}"

          echo "::group::$(basename "$APK")"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E '^package:|^native-code:'
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

          # AndroidX Core declares <applicationId>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          # for ContextCompat.registerReceiver. It is defined by this app, namespaced to
          # this app, and protectionLevel="signature", so no other app can ever hold it and
          # it grants no user-facing capability. Anything else — any android.permission.*
          # or third-party permission — means a dependency reintroduced one, which is a bug.
          PERMS="$("$BUILD_TOOLS/aapt2" dump permissions "$APK" \
                   | grep -E '^uses-permission:' \
                   | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)"
          if [ -n "$PERMS" ]; then
            echo "::error::$(basename "$APK") requests permissions it should not have:"
            echo "$PERMS"
            exit 1
          fi

          # The APK must carry the architecture this job was asked to build, and
          # only that one.
          ABIS="$(unzip -Z1 "$APK" 'lib/*' | cut -d/ -f2 | sort -u)"
          if [ "$ABIS" != "$ABI" ]; then
            echo "::error::$(basename "$APK") carries '$(echo $ABIS)', expected '$ABI'."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"
          echo "$(basename "$APK"): $ABIS, $((SIZE / 1000000)) MB"
          if [ "$SIZE" -gt "$MAX_APK_BYTES" ]; then
            echo "::error::$(basename "$APK") is ${SIZE} bytes, over the ${MAX_APK_BYTES}-byte ceiling."
            exit 1
          fi
          echo "::endgroup::"

      - name: Name the APK after the release
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk \
            "dist/BracketUp-${VERSION}-${{ matrix.abi }}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  smoke-test:
    # R8 runs over release builds, and a missing keep rule only shows up at
    # runtime, so the APK is installed and the first screen checked before
    # anything is published. The emulator is x86_64, so this can only run when
    # that ABI was built — an arm64-only dry run skips it and is checked on the
    # phone instead.
    needs: [setup, build]
    if: contains(needs.setup.outputs.abis, 'x86_64')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the x86_64 APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./scripts/smoke-test-apk.sh "$(ls dist/*-x86_64.apk)"

  publish:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      # The per-ABI jobs each check their own APK; nothing until here sees all
      # three together, and a release missing one would strand those devices.
      - name: Check all three APKs are present
        run: |
          shopt -s nullglob
          APKS=(dist/*.apk)
          if [ "${#APKS[@]}" -ne 3 ]; then
            echo "::error::Expected 3 APKs to publish, found ${#APKS[@]}."
            ls -l dist
            exit 1
          fi
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
