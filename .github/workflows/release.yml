name: Release APK

# Builds a signed universal APK and attaches it to a GitHub Release.
# IzzyOnDroid watches this repo's releases and picks the APK up automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Verify committed android/ matches app.json
        run: npm run prebuild:check

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See FDROID.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          BRACKETUP_STORE_FILE: ${{ runner.temp }}/release.keystore
          BRACKETUP_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BRACKETUP_KEY_ALIAS: bracketup
          BRACKETUP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Confirm the APK is signed with the release key and requests no permissions
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

          # AndroidX Core declares <applicationId>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          # for ContextCompat.registerReceiver. It is defined by this app, namespaced to
          # this app, and protectionLevel="signature", so no other app can ever hold it and
          # it grants no user-facing capability. Anything else — any android.permission.*
          # or third-party permission — means a dependency reintroduced one, which is a bug.
          PERMS="$("$BUILD_TOOLS/aapt2" dump permissions "$APK" \
                   | grep -E '^uses-permission:' \
                   | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)"
          if [ -n "$PERMS" ]; then
            echo "::error::APK requests permissions it should not have:"
            echo "$PERMS"
            exit 1
          fi
          echo "APK requests no Android permissions."

      - name: Name the APK after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "BracketUp-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BracketUp-*.apk
          generate_release_notes: true
