MaintainerNotes: |-
  Expo (React Native) app. The native android/ project is committed to the
  repository and is regenerated with `npx expo prebuild`; CI fails the build if
  it drifts from app.json, so the checked-in project always matches the config.

  Every release has three builds, one per ABI, because a universal APK is ~97 MB.
  The Gradle build splits the APK by ABI and `reactNativeArchitectures` narrows
  each build entry to a single one, so every entry here produces exactly one APK,
  whose versionCode is `expo.android.versionCode * 10 + <abi offset>`
  (armeabi-v7a 1, arm64-v8a 2, x86_64 3), assigned in plugins/withAbiSplits.js.
  VercodeOperation reproduces that scheme, so the auto-updater copies all three
  entries on a new tag and gives each the right code — the build blocks are
  ordered to match the operations, ascending.

  `scanignore: node_modules` covers the prebuilt tooling React Native ships
  inside node_modules (hermesc, the Gradle plugin's jars) and the local Maven
  repos a few Expo modules carry. All of it is build-time only and none of it is
  packaged into the APK; the native libraries that are shipped are compiled
  during the Gradle build from the Maven-hosted React Native and Hermes sources.

  Node and Temurin 17 are fetched in sudo. Each ABI entry re-runs that block on
  the same VM, so the install is idempotent (`rm -rf /opt/node`, `ln -sf`).

  `gradle assembleRelease` produces an unsigned APK here: the release signing
  config activates only when a keystore is supplied via environment variables,
  which the upstream GitHub Actions release build does and this build does not.
  No keystore is committed to the repository.

  Release builds run R8 (`android.enableMinifyInReleaseBuilds=true`). The keep
  rules live in android/app/proguard-rules.pro; upstream CI installs the
  minified APK on an emulator and fails the release if the app does not render.

  The app is fully offline: it declares no Android permissions at all, makes no
  network requests, and contains no analytics, advertising or crash reporting.
  No Google Play Services or other proprietary dependency is present. Every
  runtime dependency is MIT, Apache-2.0, BSD or ISC licensed.

  expo-updates is deliberately not a dependency, so there is no over-the-air
  code delivery: the JavaScript bundle is compiled into the APK at build time
  and cannot be replaced after installation. The manifest meta-data that the
  Expo template emits for expo-updates is stripped by a config plugin
  (plugins/withoutUpdatesMetadata.js) so the manifest does not imply otherwise.

